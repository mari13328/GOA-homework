
<html>
    <head>
        <title>Rehearsal</title>
    </head>
    
    <body>
        <main>
            
            <!-- HTML ==> Hyper Text Markup Language
            HTML არ არის პროგრამირების ენა, ეს არის 
            მარკირების ენა, რაც იმას ნიშნავს რომ ამ
            მარკირების ენაში კოდს საწერად ვიყენებთ თეგს-->
            
            <!--  HTNL ში თეგები იყოპიან ორ ნაწილად ,
            პირველი არის "Empty" თეგები და მეორე არის "Container"-->
            
            <!-- Empty ==> თეგვს აქვს მხოლოდ გამხსნელი თეგი მაგ: img, source , br ... -->
            
            <!-- Container  ==> თეგვს აქვს როგორც გამხსნელი ასევე დამხურავი თეგები მაგ: selection , header , body ,
            p , h1 , b , strong , main ... -->
<!-- ========================================================================================================================= -->
            <!-- p -- paragraph , გვეხმარება რომ დავამატოთ ტექსტები ვებსაიტზე -->
            
            <!-- h1-h6 -- სათაურები , გვეხმარება რომ დავამატოთ სათაურები ვებსაიტზე , 
            განსხვავდებიან მხოლოდ და მხოლოდ ზომით-->
            
            <!-- button -- გვეხმარება რომ დავამატოთ ღილაკები ვებსაიტზე -->
            
            <!-- img -- გვეხმარება რპმ დავამატოთ პოტოები ვებსაიტზე -->
            
            <!-- არსებობს ორი სახის ატრიბუტი -- ესენია ==> requred-აუცილებელი და optional - არჩევითი,
            ატრიბუტია გვეხმარება იმაში რომ თეგზე მოვიპოვოთ უპრო მეტი კონტროლი-->
            
<!-- ================================================================================================================= -->
            
            <!-- ვებსაიტზე ლინკის დასამატებლად გვეხმარება ==> <a herf=""></a> თეგი -->
            
            <!-- დაულაგებელი სია
            (unordered list)
            <ul>
                ლისტის აითემი(list item)
                <li></li>
            </ul>-->
            <ul>
                <li>BMW</li>
                <li>AUDI</li>
            </ul>
            
            
            
            <!-- დალაგებული სია
            (orderd list)-->
            <!-- <ol>
                <li></li>
            </ol> -->
            <ol>
                <li>Mersedes</li>
                <li>Fordi</li>
            </ol>
            
                                                                                                                        
            
            <!-- <nav></nav> ==> ნავიგაცია გვეხმარება იმაში რომ გადავადგილდეთ ვებსაიტზე მარტივად
            სხვადასხვა ფეიჯებზე-->
            
                                                                                                                        
            
            
            <!-- არსებობს ორი ტიპის ვებსაიტი ესენია ==>
            multypage website  და singelpage website, -->
            
            <!-- multypage website ის დროს საიტზე მოცემული იპორმაცია
            გადანაწილდება სხვადასხვა პეიჯზე(შედგება ერთზე მეტი ვებსაიტისგან(გვერდისგან)) -->
            
            <!-- singekpage website ის დროს საიტზე მოცემული ინპორმაცია
            მოთავსებულია ერთ ფეიჯზე(გვერდეზე) -->
            
                                                                                                                        
            
            <!-- forms ==> ვიყენებთ მომხმარებელს რო შემოვატანინოთ მისი ინპორმაცია
            და რო შევინახოთ ანუ რეგისტრაციას ვაკეთებთ-->
            <forms>
                <label for="name">Name:</label>
                <input type="text" name="username" id="name" required value="Enter your name"> 
                <br><br>
                <label for="pas">Password:</label>
                <input type="password" name="password" id="pas" required >
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                <br><br>
                <input type="sumbit"> 
                <br><br>
            </forms>
            
                                                                                                                        
            
            <select name="cars">
                <optgroup label="New cars">
                    <option value="BMW1"selected>BMW1</option>
                    <option value="BMW2">BMW2</option>
                    <option value="BMW3">BMW3</option>
                    <option value="BMW4">BMW4</option>
                
                <optgroup label="Old cars">
                    <option value="BMW1"selected>BMW1</option>
                    <option value="BMW2">BMW2</option>
                    <option value="BMW3">BMW3</option>
                    <option value="BMW4">BMW4</option>
            </select>
            </optgroup>
            
            
            <video controls loop autoplay muted>
                <source src="">
            </video>
            
            
            
                                                                                                                        
            
            <tabel border="1">
                <tr>
                    <!--  -->
                    <th>x5</th>
                    <th>cls</th>
                    <th>rsrs</th>
                </tr>
                
                <tr>
                    <td>bmw</td>
                    <td>mersedes</td>
                    <td>audi</td>
                </tr>
                
                <tr>
                    <!-- tabel date -->
                    <td>6x</td>
                    <td colspan="2"
                    >both</td>
                </tr>
                </table>
                
        </main>
    </body>
</html>
